name: test

on:
  push:
  pull_request:

jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # 합성 데이터 자체 검증 — 코딩 오류 확인이지 성능이 아니다
      - run: python wafer_pattern_classifier.py
      - run: pytest -q
